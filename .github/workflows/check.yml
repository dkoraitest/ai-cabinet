# Автотест установки кабинета: как у участника (git clone, check, serve, update),
# но в профиле с кириллицей и пробелом. Путь профиля задается только через env,
# чтобы PowerShell 5.1 не испортил кириллицу в тексте скрипта.
name: check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            profile: 'C:\Users\Айгуль Н'
    env:
      PROFILE_DIR: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------------- macOS ----------------
      - name: macOS, профиль с кириллицей и пробелом
        if: runner.os == 'macOS'
        env:
          TMP_BASE: ${{ runner.temp }}
        run: echo "PROFILE_DIR=$TMP_BASE/Айгуль Н" >> "$GITHUB_ENV"

      - name: macOS, установка как у участника и повторная установка
        if: runner.os == 'macOS'
        run: |
          set -u
          mkdir -p "$PROFILE_DIR"
          export HOME="$PROFILE_DIR"
          git clone "$GITHUB_WORKSPACE" "$HOME/ai-cabinet"
          out=$(git clone "$GITHUB_WORKSPACE" "$HOME/ai-cabinet" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'already exists'
          test -f "$HOME/ai-cabinet/START.md"

      - name: macOS, check, страница, update, тесты
        if: runner.os == 'macOS'
        run: |
          set -eu
          export HOME="$PROFILE_DIR"
          cd "$HOME/ai-cabinet"
          node tools/check.mjs --json > "$RUNNER_TEMP/check.json" || true
          cat "$RUNNER_TEMP/check.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const f=r.filter(x=>x.status==='fail');if(f.length){console.error('FAIL:',JSON.stringify(f));process.exit(1)}" "$RUNNER_TEMP/check.json"
          node tools/serve.mjs > "$RUNNER_TEMP/serve.log" 2>&1 &
          pid=$!
          url=""
          for i in $(seq 1 20); do
            url=$(grep -Eo 'http://localhost:[0-9]+/[0-9a-f]{32}/' "$RUNNER_TEMP/serve.log" | head -n 1 || true)
            if [ -n "$url" ]; then break; fi
            sleep 1
          done
          if [ -z "$url" ]; then cat "$RUNNER_TEMP/serve.log"; kill "$pid" || true; exit 1; fi
          port=$(echo "$url" | sed -E 's#http://localhost:([0-9]+)/.*#\1#')
          code=$(curl -sS -o "$RUNNER_TEMP/page.html" -w '%{http_code}' "$url")
          code_root=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/")
          kill "$pid" || true
          test "$code" = 200
          test "$code_root" = 403
          grep -q 'data-cabinet=.ok.' "$RUNNER_TEMP/page.html"
          out=$(node tools/update.mjs)
          echo "$out"
          echo "$out" | grep -q 'Обновлений нет'
          node --test

      - name: macOS, check --net (справочно)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          export HOME="$PROFILE_DIR"
          cd "$HOME/ai-cabinet"
          node tools/check.mjs --net

      # ---------------- Windows ----------------
      - name: Windows (PowerShell 5.1), установка как у участника и повторная установка
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # git messages go to stderr, this must not abort the script.
          $ErrorActionPreference = 'Continue'
          $env:USERPROFILE = $env:PROFILE_DIR
          $env:HOME = $env:PROFILE_DIR
          New-Item -ItemType Directory -Force -Path $env:PROFILE_DIR | Out-Null
          # The automatic $HOME variable in PowerShell does not follow $env:HOME,
          # so we use "$env:PROFILE_DIR\ai-cabinet" instead of "$HOME\ai-cabinet".
          # Same install line as the participant's, but the source is the local checkout.
          git clone "$env:GITHUB_WORKSPACE" "$env:PROFILE_DIR\ai-cabinet"
          if ($LASTEXITCODE -ne 0) { throw "first install failed ($LASTEXITCODE)" }
          $out = (git clone "$env:GITHUB_WORKSPACE" "$env:PROFILE_DIR\ai-cabinet" 2>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch 'already exists') { throw 'second install: git did not report already exists' }
          if (-not (Test-Path -LiteralPath "$env:PROFILE_DIR\ai-cabinet\START.md")) { throw 'cabinet is damaged: START.md missing' }
          exit 0

      - name: Windows (PowerShell 5.1), check
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $env:USERPROFILE = $env:PROFILE_DIR
          $env:HOME = $env:PROFILE_DIR
          Set-Location -LiteralPath "$env:PROFILE_DIR\ai-cabinet"
          $json = (node tools/check.mjs --json | Out-String)
          Write-Host $json
          $bad = @(($json | ConvertFrom-Json) | Where-Object { $_.status -eq 'fail' })
          if ($bad.Count -gt 0) { throw "check: fail items present ($($bad.Count))" }
          exit 0

      - name: Windows (PowerShell 5.1), страница на localhost
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $env:USERPROFILE = $env:PROFILE_DIR
          $env:HOME = $env:PROFILE_DIR
          $clone = "$env:PROFILE_DIR\ai-cabinet"
          $log = "$env:RUNNER_TEMP\serve.log"
          $err = "$env:RUNNER_TEMP\serve.err"
          $p = Start-Process node -ArgumentList 'tools/serve.mjs' -WorkingDirectory $clone -PassThru -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError $err
          try {
            $url = $null
            for ($i = 0; $i -lt 20; $i++) {
              if (Test-Path $log) {
                $txt = [string](Get-Content -Encoding UTF8 -Raw $log)
                if ($txt) {
                  $m = [regex]::Match($txt, 'http://localhost:\d+/[0-9a-f]{32}/')
                  if ($m.Success) { $url = $m.Value; break }
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $url) { throw 'page address did not appear within 20 seconds' }
            $resp = Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 5
            if ($resp.StatusCode -ne 200) { throw "status $($resp.StatusCode)" }
            if ($resp.Content -notmatch 'data-cabinet=.ok.') { throw 'page marker not found' }
            $port = ([uri]$url).Port
            $code = 0
            try { $r2 = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5; $code = [int]$r2.StatusCode }
            catch { if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode } }
            if ($code -ne 403) { throw "root without token returned $code, expected 403" }
            Write-Host 'page opens'
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Windows (Git Bash), check и update
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          export HOME="$(cygpath -u "$PROFILE_DIR")"
          export USERPROFILE="$PROFILE_DIR"
          export LC_ALL=C.UTF-8
          cd "$HOME/ai-cabinet"
          node tools/check.mjs --json > "$RUNNER_TEMP/check.json" || true
          cat "$RUNNER_TEMP/check.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const f=r.filter(x=>x.status==='fail');if(f.length){console.error('FAIL:',JSON.stringify(f));process.exit(1)}" "$(cygpath -w "$RUNNER_TEMP/check.json")"
          # stdout node - UTF-8 байты, grep -F сравнивает байты
          out=$(node tools/update.mjs)
          echo "$out"
          echo "$out" | grep -qF 'Обновлений нет'

      - name: Windows (pwsh), node --test из папки с кириллицей
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = $env:PROFILE_DIR
          $env:HOME = $env:PROFILE_DIR
          Set-Location -LiteralPath "$env:PROFILE_DIR\ai-cabinet"
          node --test
          if ($LASTEXITCODE -ne 0) { throw "node --test: exit code $LASTEXITCODE" }

      - name: Windows, check --net (справочно)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $env:USERPROFILE = $env:PROFILE_DIR
          $env:HOME = $env:PROFILE_DIR
          Set-Location -LiteralPath "$env:PROFILE_DIR\ai-cabinet"
          node tools/check.mjs --net
          exit 0

  # Установка по публичной ссылке без токенов, как у участника.
  anonymous-clone:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Анонимный clone, check --net, update
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dest = "$env:RUNNER_TEMP\anon\ai-cabinet"
          git clone https://github.com/dkoraitest/ai-cabinet $dest
          if ($LASTEXITCODE -ne 0) { throw "anonymous clone failed ($LASTEXITCODE)" }
          Set-Location -LiteralPath $dest
          $json = (node tools/check.mjs --net --json | Out-String)
          Write-Host $json
          $bad = @(($json | ConvertFrom-Json) | Where-Object { $_.status -eq 'fail' })
          if ($bad.Count -gt 0) { throw "check --net: fail items present ($($bad.Count))" }
          exit 0
      # Русский текст читаем в Git Bash: PowerShell 5.1 портит кодировку вывода node.
      - name: Анонимный clone, update
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP/anon/ai-cabinet"
          out=$(node tools/update.mjs)
          echo "$out"
          echo "$out" | grep -qF 'Обновлений нет'
