<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Мой кабинет</title>
<style>
  /* Цвета и размеры страницы. Папка бренда (brand/theme.css, подключена ниже) переопределяет эти переменные:
     --accent и --accent-ink: кнопка «Запустить» и её текст; --accent-dark и --accent-dark-ink: кнопка
     под указателем; --link: ссылки на файлы; --stripe: полоса над шапкой; --logo-height: высота логотипа.
     Текст на кнопке и ссылки держат контраст не ниже 4,5:1 (WCAG AA). */
  :root {
    color-scheme: light;
    --bg: #f4f6f9;
    --card: #ffffff;
    --header-bg: #ffffff;
    --text: #172033;
    --muted: #5b6577;
    --line: #e2e7ee;
    --line-strong: #cfd6e0;
    --th-bg: #f6f8fb;
    --accent: #2456c9;
    --accent-ink: #ffffff;
    --accent-dark: #1a3f96;
    --accent-dark-ink: #ffffff;
    --link: var(--accent-dark);
    --stripe: var(--accent);
    --logo-height: 40px;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 2px 8px rgba(16, 24, 40, 0.04);
    --red: #b42318;
    --red-bg: #fef1f0;
    --yellow: #8a5300;
    --yellow-bg: #fff7e0;
    --green: #1f7a3a;
    --green-bg: #effaf2;
    --grey: #4f5662;
    --grey-bg: #f0f2f5;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }

  /* Шапка: полоса цвета компании, логотип, название страницы. */
  .top {
    background: var(--header-bg);
    border-bottom: 1px solid var(--line);
    box-shadow: inset 0 4px 0 var(--stripe);
  }
  .top-inner { display: flex; align-items: center; gap: 16px 22px; min-height: 80px; padding-top: 4px; }
  .brand-logo { display: block; height: var(--logo-height); width: auto; max-width: 260px; object-fit: contain; }
  .brand-name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  h1 { font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .top.branded h1 { padding-left: 22px; border-left: 1px solid var(--line-strong); color: var(--muted); }

  main { padding-top: 28px; padding-bottom: 56px; }
  .lead { margin: 0 0 22px; color: var(--muted); font-size: 17px; }
  .empty, .loading {
    background: var(--card);
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    padding: 40px 28px;
    font-size: 19px;
    text-align: center;
    color: var(--muted);
    margin: 0;
  }

  /* Карточка-ссылка на сервис «Спроси таблицу» (страница analiz.html): видна всегда, над карточками процессов. */
  .service {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 24px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
    color: var(--text);
    text-decoration: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .service:hover { border-color: var(--accent-dark); box-shadow: 0 2px 4px rgba(16, 24, 40, 0.06), 0 6px 18px rgba(16, 24, 40, 0.08); }
  .service:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }
  .service-icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--th-bg);
    box-shadow: inset 0 0 0 1px var(--line);
    color: var(--accent-dark);
  }
  .service-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .service-title { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
  .service-desc { color: var(--muted); font-size: 16px; }
  .service-go { flex: none; color: var(--link); font-weight: 600; font-size: 16px; white-space: nowrap; }

  /* Карточка процесса. */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 26px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card > :last-child { margin-bottom: 0; }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .card-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
  .card h2 { font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge-red { color: var(--red); background: var(--red-bg); box-shadow: inset 0 0 0 1px rgba(180, 35, 24, 0.18); }
  .badge-yellow { color: var(--yellow); background: var(--yellow-bg); box-shadow: inset 0 0 0 1px rgba(138, 83, 0, 0.18); }
  .badge-green { color: var(--green); background: var(--green-bg); box-shadow: inset 0 0 0 1px rgba(31, 122, 58, 0.18); }
  .updated { color: var(--muted); font-size: 15px; margin: 4px 0 14px; }
  .summary {
    font-size: 18px;
    margin: 0 0 18px;
    padding: 12px 16px;
    background: var(--th-bg);
    border-radius: 10px;
  }

  /* Таблица результата: шапка таблицы остаётся на месте при прокрутке длинного списка. */
  .table-wrap { overflow: auto; max-height: 72vh; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--th-bg);
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    border-bottom-color: var(--line-strong);
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background-image: linear-gradient(rgba(16, 24, 40, 0.035), rgba(16, 24, 40, 0.035)); }
  td.mark { font-weight: 600; white-space: nowrap; }
  tr.row-red td { background-color: var(--red-bg); }
  tr.row-yellow td { background-color: var(--yellow-bg); }
  tr.row-green td { background-color: var(--green-bg); }
  tr.row-grey td { background-color: var(--grey-bg); }
  tr.row-red td.mark { color: var(--red); }
  tr.row-yellow td.mark { color: var(--yellow); }
  tr.row-green td.mark { color: var(--green); }
  tr.row-grey td.mark, tr.row-info td.mark { color: var(--grey); }
  tr[class^="row-"] td.mark::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 8px 1px 0;
    border-radius: 50%;
    background: currentColor;
    vertical-align: middle;
  }
  tr.row-info td.mark::before { border-radius: 2px; }
  .files { margin: 16px 0 0; color: var(--muted); }
  .files a { color: var(--link); font-weight: 600; text-underline-offset: 3px; }
  .files a:hover { text-decoration-thickness: 2px; }

  /* Кнопка «Запустить»: треугольник «пуск», во время расчёта крутится значок. */
  .actions { display: flex; align-items: center; }
  .actions p { margin: 0; }
  button.run {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    min-height: 46px;
    padding: 10px 24px 10px 20px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.14);
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  button.run::before {
    content: "";
    width: 0;
    height: 0;
    border-left: 10px solid currentColor;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
  }
  button.run:hover:not(:disabled) { background: var(--accent-dark); color: var(--accent-dark-ink); }
  button.run:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }
  button.run:disabled { background: #e6e9ef; color: #4a5363; box-shadow: none; cursor: default; }
  button.run:disabled::before {
    width: 14px;
    height: 14px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    button.run:disabled::before { animation: none; }
  }
  .hint { color: var(--muted); }
  .error, .run-error { color: var(--red); overflow-wrap: anywhere; }
  .error { margin: 12px 0 0; }
  .run-error { margin: 12px 0 0; font-weight: 600; padding: 10px 14px; background: var(--red-bg); border-radius: 10px; }

  @media (max-width: 640px) {
    body { font-size: 16px; }
    .wrap { padding-left: 16px; padding-right: 16px; }
    .top-inner { min-height: 64px; }
    .brand-logo { height: calc(var(--logo-height) * 0.8); }
    h1 { font-size: 19px; }
    .top.branded h1 { padding-left: 16px; }
    main { padding-top: 20px; }
    .card { padding: 16px; }
    .card h2 { font-size: 20px; }
    .summary { font-size: 17px; }
    table { font-size: 14px; }
    .actions, button.run { width: 100%; }
    .service { padding: 14px 16px; gap: 14px; align-items: flex-start; }
    .service-go { display: none; }
  }
</style>
<link rel="stylesheet" href="brand/theme.css">
</head>
<body data-cabinet="ok">
<header class="top" id="top">
  <div class="wrap top-inner">
    <img class="brand-logo" id="brand-logo" alt="" hidden>
    <span class="brand-name" id="brand-name" hidden></span>
    <h1>Мой кабинет</h1>
  </div>
</header>
<main class="wrap">
  <a class="service" href="analiz.html">
    <span class="service-icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="20" height="18" rx="3"/><path d="M3 10h20M10 10v12"/><path d="M14.5 18.5v-3M17.5 18.5v-5M20.5 18.5v-2"/></svg></span>
    <span class="service-text">
      <span class="service-title">Спроси таблицу</span>
      <span class="service-desc">Задайте вопрос своим таблицам: считает программа на вашем компьютере, строки никуда не уходят</span>
    </span>
    <span class="service-go" aria-hidden="true">Открыть →</span>
  </a>
  <div id="processes" aria-live="polite"><p class="loading">Загружаю процессы…</p></div>
</main>
<script src="render.js"></script>
<script>
(function () {
  'use strict';
  var box = document.getElementById('processes');
  var list = [];
  var messages = {};
  var POLL_MS = 2000;
  var REFRESH_MS = 10000;
  var shown = '';
  var OFFLINE = 'Страница не отвечает. Скажите Claude «открой страницу».';
  var STOPPED = 'Страница остановлена. Скажите Claude «открой страницу».';
  // После трёх неудачных запросов подряд вкладка больше ничего не спрашивает: страница остановлена,
  // а на её номере может работать чужая программа. Адрес с новым токеном даёт Claude.
  var MAX_FAILS = 3;
  var fails = 0;
  var stopped = false;
  var timer = null;

  // true: запросов больше не будет.
  function failed() {
    fails += 1;
    if (fails < MAX_FAILS) return false;
    stopped = true;
    if (timer !== null) clearInterval(timer);
    shown = '';
    box.innerHTML = '<p class="empty">' + STOPPED + '</p>';
    return true;
  }

  function answered() {
    fails = 0;
  }

  // Перерисовываем, только если что-то поменялось: иначе прокрутка таблиц сбрасывалась бы раз в 10 секунд.
  function draw() {
    if (stopped) return;
    var html = window.CabinetRender.renderPage(list, messages);
    if (html === shown) return;
    shown = html;
    box.innerHTML = html;
  }

  function find(slug) {
    for (var i = 0; i < list.length; i++) if (list[i].slug === slug) return list[i];
    return null;
  }

  function setRunning(slug, running) {
    var p = find(slug);
    if (p) p.running = running;
  }

  function load() {
    if (stopped) return;
    return fetch('api/processes', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function (data) {
        if (!Array.isArray(data)) throw new Error('не список');
        answered();
        list = data;
        draw();
        list.forEach(function (p) {
          if (p.running) poll(p.slug);
        });
      })
      .catch(function () {
        if (failed()) return;
        shown = '';
        box.innerHTML = '<p class="empty">' + OFFLINE + '</p>';
      });
  }

  var polling = {};

  // Раз в 2 секунды спрашиваем, идёт ли расчёт; по окончании перерисовываем карточки.
  function poll(slug) {
    if (stopped || polling[slug]) return;
    polling[slug] = true;
    setTimeout(function () {
      if (stopped) return;
      fetch('api/status/' + encodeURIComponent(slug), { cache: 'no-store' })
        .then(function (r) {
          if (r.status === 403) throw new Error('403');
          return r.json();
        })
        .then(function (s) {
          answered();
          polling[slug] = false;
          if (s.running) return poll(slug);
          if (s.lastRun && !s.lastRun.ok) {
            messages[slug] = 'Расчёт не удался. Подробности в output/' + slug + '/last-run.log';
          } else {
            delete messages[slug];
          }
          return load();
        })
        .catch(function () {
          polling[slug] = false;
          if (failed()) return;
          messages[slug] = OFFLINE;
          setRunning(slug, false);
          draw();
        });
    }, POLL_MS);
  }

  function run(slug) {
    if (stopped) return;
    delete messages[slug];
    setRunning(slug, true);
    draw();
    fetch('api/run/' + encodeURIComponent(slug), {
      method: 'POST',
      headers: { 'X-Cabinet': '1', 'Content-Type': 'application/json' },
      body: '{}',
    })
      .then(function (r) {
        if (r.status === 202) {
          answered();
          return poll(slug);
        }
        return r.json().catch(function () { return {}; }).then(function (j) {
          // 403 без текста ошибки: адрес с этим токеном уже не страница кабинета.
          if (r.status === 403 && !j.error) throw new Error('403');
          answered();
          messages[slug] = j.error || 'Не получилось запустить расчёт.';
          // 409 ERUNNING: этот процесс уже идёт, ждём его; успел закончиться, показываем свежую карточку.
          // 409 ELIMIT (идут два других расчёта) и прочие ошибки: текст остаётся, кнопка снова доступна.
          if (r.status === 409 && j.code === 'ERUNNING') {
            return fetch('api/status/' + encodeURIComponent(slug), { cache: 'no-store' })
              .then(function (x) { return x.json(); })
              .then(function (s) {
                if (s.running) {
                  draw();
                  return poll(slug);
                }
                delete messages[slug];
                return load();
              });
          }
          setRunning(slug, false);
          draw();
        });
      })
      .catch(function () {
        if (failed()) return;
        messages[slug] = OFFLINE;
        setRunning(slug, false);
        draw();
      });
  }

  box.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-run]');
    if (b && !b.disabled && !stopped) run(b.getAttribute('data-run'));
  });
  // Вернулись на страницу (например, после запуска фразой в Claude): показываем свежие карточки.
  window.addEventListener('focus', load);
  // Запуск фразой в Claude: пока страница на экране, список перечитывается раз в 10 секунд, и время на карточке
  // обновляется без перезагрузки. Скрытая вкладка не опрашивает.
  timer = setInterval(function () {
    if (document.visibilityState === 'visible') load();
  }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') load();
  });
  load();
})();
</script>
<script>
// Логотип и название компании из папки бренда (tools/brand.mjs): brand/logo.svg, иначе brand/logo.png,
// название из brand/brand.json ({"name": "..."}). Нет папки или файла: шапка без логотипа и пустых рамок.
(function () {
  'use strict';
  var top = document.getElementById('top');
  var logo = document.getElementById('brand-logo');
  var nameBox = document.getElementById('brand-name');
  if (!top || !logo || !nameBox || typeof logo.addEventListener !== 'function') return;
  var TITLE = 'Мой кабинет';
  var sources = ['brand/logo.svg', 'brand/logo.png'];
  var state = { name: '', logo: false };

  function paint() {
    top.className = state.logo || state.name ? 'top branded' : 'top';
    logo.hidden = !state.logo;
    logo.alt = state.name || 'Логотип компании';
    // С логотипом название не повторяем: оно уже на логотипе.
    nameBox.hidden = state.logo || !state.name;
    nameBox.textContent = state.name;
    document.title = state.name ? TITLE + ' · ' + state.name : TITLE;
  }

  logo.addEventListener('load', function () {
    state.logo = true;
    paint();
  });
  logo.addEventListener('error', function () {
    sources.shift();
    if (sources.length) {
      logo.src = sources[0];
      return;
    }
    state.logo = false;
    paint();
  });
  logo.src = sources[0];

  fetch('brand/brand.json', { cache: 'no-store' })
    .then(function (r) {
      return r.ok ? r.json() : null;
    })
    .then(function (b) {
      var name = b && typeof b.name === 'string' ? b.name.trim().slice(0, 80) : '';
      if (!name) return;
      state.name = name;
      paint();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
